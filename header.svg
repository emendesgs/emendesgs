<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="100%" height="220" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e" />
      <stop offset="100%" stop-color="#1a1b26" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#7dcfff" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect x="1" y="1" width="838" height="218" rx="12" fill="url(#bgGrad)" stroke="#292e42" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <path d="M 1 13 C 1 6.37 6.37 1 13 1 L 827 1 C 833.63 1 839 6.37 839 13 L 839 38 L 1 38 Z" fill="#1f2335" />
  <line x1="1" y1="38" x2="839" y2="38" stroke="#292e42" stroke-width="1" />

  <!-- Terminal Window Controls -->
  <circle cx="22" cy="19.5" r="5.5" fill="#f7768e" />
  <circle cx="38" cy="19.5" r="5.5" fill="#e0af68" />
  <circle cx="54" cy="19.5" r="5.5" fill="#9ece6a" />

  <!-- Window Title -->
  <text x="420" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#787c99" text-anchor="middle">
    emendesgs.dev — Architecture &amp; Engineering Console
  </text>

  <!-- Logo prompt -->
  <text x="32" y="72" font-family="'Fira Code', 'JetBrains Mono', Courier, monospace" font-size="14" font-weight="700" fill="#7dcfff">
    e&gt;erton<tspan fill="#7aa2f7">.dev</tspan>
  </text>

  <!-- Main Name Title -->
  <text x="32" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
    Everton Mendes
  </text>

  <!-- Role Subtitle -->
  <text x="32" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#7aa2f7">
    IT Specialist &amp; Senior Software Engineer
  </text>

  <!-- Core Specialization -->
  <text x="32" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#a9b1d6">
    Angular Ecosystem (Signals/RxJS) · Micro-frontends (Module Federation) · Enterprise Design Systems · Java
  </text>

  <!-- Status pill / indicator inside terminal -->
  <g transform="translate(32, 180)">
    <rect width="360" height="24" rx="12" fill="rgba(125, 207, 255, 0.08)" stroke="rgba(125, 207, 255, 0.25)" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#9ece6a" />
    <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#9ece6a">
      IT Specialist @F1RST (Santander) · Open to opportunities
    </text>
  </g>
</svg>
