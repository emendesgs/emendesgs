<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 190" width="100%" height="190" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e" />
      <stop offset="100%" stop-color="#1a1b26" />
    </linearGradient>

    <!-- Dot Grid Pattern for Texture -->
    <pattern id="dotMatrix" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#7dcfff" fill-opacity="0.22" />
    </pattern>

    <!-- Fade Mask for Right-side Texture -->
    <linearGradient id="fadeMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <mask id="textureMask">
      <rect x="420" y="38" width="418" height="150" fill="url(#fadeMask)" />
    </mask>

    <!-- Subtle Radial Glow behind nodes -->
    <radialGradient id="meshGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Frame -->
  <rect x="1" y="1" width="838" height="188" rx="12" fill="url(#bgGrad)" stroke="#292e42" stroke-width="1.2" />

  <!-- Window Header Bar -->
  <path d="M 1 12 C 1 5.92 5.92 1 12 1 L 828 1 C 834.08 1 839 5.92 839 12 L 839 36 L 1 36 Z" fill="#1f2335" />
  <line x1="1" y1="36" x2="839" y2="36" stroke="#292e42" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="20" cy="18.5" r="5" fill="#f7768e" />
  <circle cx="35" cy="18.5" r="5" fill="#e0af68" />
  <circle cx="50" cy="18.5" r="5" fill="#9ece6a" />

  <!-- Window Console Title -->
  <text x="420" y="23" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#565f89" text-anchor="middle" letter-spacing="0.04em">
    architecture.config.ts — bash
  </text>

  <!-- Right-side Ambient Glow -->
  <rect x="420" y="37" width="418" height="151" fill="url(#meshGlow)" />

  <!-- Right-side Architectural Mesh / Texture -->
  <g mask="url(#textureMask)">
    <!-- Dot Matrix -->
    <rect x="420" y="37" width="418" height="151" fill="url(#dotMatrix)" />

    <!-- Isometric Architecture Lines & Nodes -->
    <path d="M 490 155 L 550 115 L 640 115 L 700 75 L 790 75" stroke="#7dcfff" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.55" fill="none" />
    <circle cx="550" cy="115" r="3" fill="#7dcfff" opacity="0.8" />
    <circle cx="640" cy="115" r="3" fill="#7aa2f7" opacity="0.8" />
    <circle cx="700" cy="75" r="3" fill="#bb9af7" opacity="0.8" />

    <path d="M 520 80 L 590 80 L 650 140 L 760 140 L 805 105" stroke="#bb9af7" stroke-width="1.2" opacity="0.4" fill="none" />
    <circle cx="590" cy="80" r="2.5" fill="#bb9af7" opacity="0.7" />
    <circle cx="650" cy="140" r="2.5" fill="#9ece6a" opacity="0.7" />
    <circle cx="760" cy="140" r="2.5" fill="#7dcfff" opacity="0.7" />

    <line x1="640" y1="115" x2="650" y2="140" stroke="#7aa2f7" stroke-width="1" stroke-dasharray="2 2" opacity="0.4" />
    <line x1="590" y1="80" x2="640" y2="115" stroke="#7dcfff" stroke-width="1" stroke-dasharray="2 2" opacity="0.35" />
  </g>

  <!-- Left Side: Brand Logo (Exact portfolio colors: white e, cyan >, white erton, blue .dev) -->
  <text x="36" y="76" font-family="'Fira Code', 'JetBrains Mono', Courier, monospace" font-size="16" font-weight="700">
    <tspan fill="#ffffff">e</tspan><tspan fill="#7dcfff" font-weight="800">&gt;</tspan><tspan fill="#ffffff">erton</tspan><tspan fill="#7aa2f7" font-weight="600">.dev</tspan>
  </text>

  <!-- Name -->
  <text x="36" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="27" font-weight="800" fill="#ffffff" letter-spacing="-0.025em">
    Everton Mendes
  </text>

  <!-- Role Subtitle -->
  <text x="36" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#7aa2f7">
    IT Specialist &amp; Senior Software Engineer
  </text>

  <!-- Subtitle Core Focus -->
  <text x="36" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#a9b1d6" letter-spacing="-0.01em">
    Angular Ecosystem (Signals/RxJS) · Micro-frontends (Module Federation) · Enterprise Design Systems
  </text>
</svg>
